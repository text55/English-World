<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English World — Игра «Найди пару»</title>
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="icon" type="image/x-icon" href="../images/45.png">
</head>
<body>
  <nav class="site-nav">
    <a href="../table/table.html" class="site-nav__logo">English <span>World</span></a>
    <ul class="site-nav__links">
      <li><a href="../table/table.html">Главная</a></li>
      <li><a href="matching-game.html" class="is-active">Игры</a></li>
      <li><a href="../results.html">Прогресс</a></li>
      <li><a href="../index.html">О проекте</a></li>
    </ul>
  </nav>

    <div class="container">
        <h1>Найди пару</h1>
        <p class="subtitle">Кликни на английское слово, затем на его перевод. Собери все пары как можно быстрее!</p>

        <div class="game-toolbar">
            <label for="category-select">Тема:</label>
            <select id="category-select"></select>
            <button id="restart-button" type="button">Начать заново</button>
        </div>

        <div class="game-stats">
            <div class="stat"><span class="stat-label">Ходы</span><span class="stat-value" id="moves">0</span></div>
            <div class="stat"><span class="stat-label">Время</span><span class="stat-value" id="timer">00:00</span></div>
            <div class="stat"><span class="stat-label">Найдено</span><span class="stat-value"><span id="found">0</span>/<span id="total">0</span></span></div>
            <div class="stat"><span class="stat-label">Рекорд</span><span class="stat-value" id="best-time">—</span></div>
        </div>

        <div class="game-board" id="game-board"></div>

        <div id="game-result" class="game-result hidden">
            <p id="result-text"></p>
            <button id="play-again-button" type="button">Играть ещё раз</button>
        </div>
    </div>
    <script src="../js/matching-game.js"></script>
</body>
</html>
